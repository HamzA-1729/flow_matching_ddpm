[project]
name = "flow-matching-ddpm"
version = "0.1.0"
description = "Continuous-Time Flow Matching vs. DDPM Image Generation from Scratch in PyTorch with a DiT Backbone"
readme = "README.md"
authors = [
    { name = "Hamza Sajid", email = "hamzasajid.1729@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[project.scripts]
flow-matching-ddpm = "flow_matching_ddpm:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
